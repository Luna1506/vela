# vela configuration. Edited by the settings window (`vela settings`);
# manual edits are picked up live. See README.md for every option.
[general]
width = 760
max_height = 580
vertical_position = 18
opacity = 0.86
close_on_focus_loss = true
# Monitor to always open on while connected ("desc:<make model serial>" or "DP-7"); empty = focused.
main_monitor = ""
max_results = 20
systemd_scope = true

[appearance]
theme = "dark"
accent = "#7aa2f7"
tile_size = 108
icon_size = 52
spacing = 8
columns = 0
border_radius = 22
surface_opacity = 0.06
show_labels = true
tile_background = true
tile_outline = false
font_scale = 1.0
animations = true
animation_speed = 1.0
# Blur and dim the rest of the launcher's monitor while open (needs the vela-backdrop layer rule).
backdrop = false
backdrop_dim = 0.18
# 1–4: stacks blurred layers for a stronger blur than Hyprland's decoration.blur.
backdrop_strength = 1
# false = only dim, no blur.
backdrop_blur = true

[apps]
grid = "pinned"
pinned = [
    "firefox.desktop",
    "brave-browser.desktop",
    "google-chrome.desktop",
    "chromium.desktop",
    "kitty.desktop",
    "com.mitchellh.ghostty.desktop",
    "org.kde.dolphin.desktop",
    "org.gnome.Nautilus.desktop",
    "thunar.desktop",
    "code.desktop",
    "code-oss.desktop",
    "jetbrains-idea.desktop",
    "obsidian.desktop",
    "spotify.desktop",
    "discord.desktop",
    "org.kde.kate.desktop",
    "org.gnome.TextEditor.desktop",
    "org.kde.systemsettings.desktop",
    "vela:settings",
]
hidden = []
desktop_actions = true
custom = []

[search]
apps = true
files = true
claude = true
max_app_results = 8
max_file_results = 10
file_backend = "auto"
file_roots = ["~"]
exclude = [
    ".git",
    "node_modules",
    "target",
    ".cache",
    "__pycache__",
    ".venv",
    "venv",
    ".gradle",
    ".m2",
    ".cargo",
    ".rustup",
    ".npm",
]
include_hidden = false
include_directories = true
min_file_query_len = 2
debounce_ms = 80
index_interval_minutes = 30

[claude]
always_visible = true
shift_enter = true
prefer_for_questions = true
executable = "claude"
args = ["--dangerously-skip-permissions"]
working_dir = "~"

[terminal]
executable = "kitty"

# Control center (`vela shell`, Quickshell). Theme, colours, radius, opacity,
# text size and motion come from [general]/[appearance] like the launcher's.
[panel]
width = 420
close_on_focus_loss = true
# Blur and dim the rest of the panel's monitor while open (needs the vela-shell-backdrop layer rule).
backdrop = false
backdrop_strength = 1
backdrop_blur = true
popup_timeout_secs = 5
popup_max_visible = 4
critical_popups_stay = true
group_collapsed_count = 2
# One small row per app in the panel; expands on click or when the pointer rests on it.
compact_notifications = true
workspace_osd = true
night_light_temperature = 4000
clock_centered = false
# Claude plan usage (5 h / 7 d) at the bottom; profiles: "default" (~/.claude) and ccacct names.
claude_usage = true
# true: grey text under a line instead of a card.
claude_usage_subtle = false
claude_usage_only_default = false
claude_usage_hidden = []
# Tile with the pending system updates.
updates_tile = true
# Quick Share tile (send and receive files with phones nearby).
quickshare_tile = true

# While you're away (`vela idle` runs hypridle with these). Minutes without input.
[idle]
dim = true
dim_after_min = 2.5
lock = true
lock_after_min = 5.0
screen_off = true
screen_off_after_min = 5.5
# false = the computer never goes to sleep on its own.
suspend = true
suspend_after_min = 30.0
lock_before_sleep = true

[updates]
# Look for pending updates this often (hours); 0 = never.
check_interval_hours = 6
aur = true
flatpak = true
# "Fix with Claude" opens its terminal here without switching to it;
# "" = a normal window.
claude_workspace = "special:minimized"

[pulse]
# Pulse, the task manager (vela pulse, Ctrl+Shift+Esc).
# The daemon records lightly in the background, so Pulse opens with history
# and knows what crashed or hung while it was closed.
record = true
record_interval_secs = 3
history_minutes = 60
# Minute averages for the long graphs (1 h / 24 h); 0 = none.
long_history_hours = 24
# Measurements per second while the window is open (milliseconds between).
interval_ms = 1000
# Graphs glide between measurements; false = one step per measurement.
smooth_graphs = true
# overview, processes, performance, diagnosis, services, activity
start_page = "overview"
# Performance graphs: 60, 300, 3600 or 86400 seconds.
range_secs = 60
confirm_end = false
heat_map = true
show_kernel = false
# Performance → Sensors: "list", "graphs" (one per sensor) or "chart" (all in one).
sensor_view = "list"
# Performance → CPU: the temperature in the graphs (overall and per core).
cpu_temp = false
# Performance → CPU per core: cores the heat slows down right now turn red.
throttle_tint = true
# Ask Claude also gets the system log (warnings and errors) and Pulse's
# activity of the last hours, as a private file; 0 = off.
claude_log_hours = 0
# Keys in the window for the selected app or process: one character or
# Delete, Insert, Home, End, Space, F1–F12; "" = off. They act right away.
key_force = "k"
key_end = "g"
key_restart = "r"
key_pause = "p"
key_efficiency = "e"

[quickshare]
# Quick Share with Android and Samsung phones on the same network.
# The name phones show; "" = the hostname.
name = ""
# TCP port phones connect to. Open it in the firewall, and UDP 5353 for mDNS
# (NixOS: networking.firewall.allowedTCPPorts = [ 47392 ] and
# networking.firewall.allowedUDPPorts = [ 5353 ]).
port = 47392
