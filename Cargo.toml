[package]
name = "vela"
version = "0.46.7"
edition = "2024"
rust-version = "1.85"
description = "A fast Spotlight-style application launcher for Hyprland with file search and Claude Code integration"
license = "MIT"
repository = "https://github.com/Raindancer118/vela"
readme = "README.md"
keywords = ["launcher", "hyprland", "wayland", "gtk4"]
categories = ["gui"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
nucleo-matcher = "0.3"
async-channel = "2"
libc = "0.2"
shlex = "1"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
prost = "0.14"
p256 = { version = "0.14", features = ["ecdh"] }
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
rand = "0.10"
base64 = "0.23"
mdns-sd = "0.21"
if-addrs = "0.15"
zbus = { version = "5.13", default-features = false, features = ["blocking-api", "async-io"] }
subtle = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
